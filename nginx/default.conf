# CSE Archive SPA vhost — reached from the reverse proxy (Caddy) over a
# shared docker network; nothing is published to host ports.

server {
    listen 80;
    server_name csearchive.ir www.csearchive.ir _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing (go_router path strategy).
    location / {
        try_files $uri /index.html;
    }

    # Never cache the shell — post_build.sh stamps asset URLs with ?v= on
    # every deploy, so everything else can be cached hard.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /canvaskit/ {
        add_header Cache-Control "public, max-age=86400";
    }
}
