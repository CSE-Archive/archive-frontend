name: Build and deploy for web

on:
  push:
    branches:
      - main

  # Enable running this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 'Create .env file'
        run: echo "${{ secrets.ENV_FILE_CONTENT }}" > .env

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Era-pinned to match pubspec.lock (sdk: flutter >=3.16.6)
          flutter-version: '3.16.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # CI is set to false to prevent treating warnings as errors
      - name: Build Flutter for Web
        run: CI=false flutter build web --web-renderer canvaskit --release --no-tree-shake-icons

      - name: Run Post-Build Script
        run: |
          chmod 755 ./post_build.sh
          ./post_build.sh

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Build the SPA image on the runner and ship it as a docker save
      # tarball — nothing builds on the VM.
      - name: Build the image on the runner and ship it to the VM
        run: |
          docker build -q -t csearchive-frontend:latest .
          docker save csearchive-frontend:latest | gzip > /tmp/csearchive-frontend-image.tar.gz
          scp -q /tmp/csearchive-frontend-image.tar.gz root@94.184.47.154:/tmp/
          ssh root@94.184.47.154 '
            set -e
            gunzip -c /tmp/csearchive-frontend-image.tar.gz | docker load
            rm /tmp/csearchive-frontend-image.tar.gz
          '

      - name: Roll out the new image
        run: ssh root@94.184.47.154 'cd /opt/csearchive && docker compose up -d frontend'

      - name: Verify
        # nginx starts instantly, but keep the same tolerant retry as the api
        # pipeline so a slow VM never fails a healthy deploy.
        run: |
          for i in $(seq 1 12); do
            if curl -sf --max-time 10 https://csearchive.ir/ | grep -q '<title>'; then
              echo "SPA is live"
              exit 0
            fi
            echo "not ready yet (attempt $i/12); retrying in 10s..."
            sleep 10
          done
          echo "SPA did not become ready in time"
          exit 1
